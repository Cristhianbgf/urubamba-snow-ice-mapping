[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "urubamba"
version = "1.0.0"
description = "Snow and visible-ice mapping in the Cordillera Urubamba with Sentinel-2 and spectral pseudo-labels"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Cristhian Gamarra" }]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
